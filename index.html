    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #333;
            --accent-color: #4a6cf7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            color: var(--text-primary); overflow-x: hidden; position: relative; padding: 15px;
        }

        .background-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; overflow: hidden;
        }
        .background-video { width: 100%; height: 100%; object-fit: cover; }
        .background-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.7); z-index: -1;
        }

        .marquee-container {
            position: fixed; top: 0; left: 0; width: 100%;
            background: var(--glass-bg); backdrop-filter: blur(12px);
            padding: 8px 0; z-index: 100;
            overflow: hidden;
        }
        .marquee {
            white-space: nowrap;
            display: inline-block;
            animation: marquee 22s linear infinite;
            padding-left: 100%;
        }
        .marquee a {
            color: var(--text-primary); font-weight: bold; text-decoration: none;
            padding: 0 30px; font-size: 15px; display: inline-block;
            background: rgba(255,255,255,0.3); border-radius: 30px; margin: 0 5px;
            transition: background 0.2s;
        }
        .marquee a:hover {
            background: rgba(74,108,247,0.2); text-decoration: underline;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }    
            100% { transform: translateX(-100%); }
        }

        .main-layer { width: 100%; max-width: 520px; margin-top: 50px; }

        .avatar-wrapper {
            display: flex;
            justify-content: center;
            margin: 10px 0 20px 0;
        }
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(2px);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .avatar:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
        }

        .page-title {
            text-align: center; font-size: 30px; font-weight: 800;
            background: linear-gradient(45deg, #4a6cf7, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(15px);
            border-radius: 16px; border: 1px solid var(--glass-border);
            padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .input-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        .input-group label { margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #444; }

        textarea, select, input {
            width: 100%; padding: 10px; border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.4);
            font-size: 14px; transition: all 0.2s;
        }

        textarea { min-height: 80px; resize: vertical; }
        .hidden { display: none; }
        .compact-row { display: flex; gap: 10px; }
        .compact-row .input-group { flex: 1; }

        .btn {
            background: var(--accent-color); color: white; border: none;
            padding: 14px; border-radius: 8px; cursor: pointer;
            font-weight: 600; width: 100%; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(74, 108, 247, 0.3);
        }

        .result-container {
            margin-top: 15px; padding: 15px;
            background: rgba(74, 108, 247, 0.05);
            border-radius: 8px; border: 1px dashed var(--accent-color);
            word-break: break-all;
        }
        .result-link { font-size: 12px; color: var(--accent-color); font-family: monospace; }

        .music-player { position: fixed; bottom: 25px; right: 25px; }
        .music-toggle {
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--glass-bg); display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            border: 1px solid var(--glass-border); font-size: 20px;
            transition: background 0.2s;
        }
        .music-toggle.playing {
            animation: spin 4s linear infinite;
            background: rgba(74,108,247,0.3);
        }
        @keyframes spin { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }

        .music-hint {
            position: fixed; bottom: 75px; right: 25px;
            background: var(--glass-bg); backdrop-filter: blur(4px);
            font-size: 10px; padding: 4px 8px; border-radius: 20px;
            border: 1px solid var(--glass-border);
            color: #444; pointer-events: none;
        }
        .note-text { font-size: 11px; color: #777; margin-top: 2px; }
    </style>

<body>

    <div class="main-layer">

            <div class="input-group hidden" id="custom-backend-group">

            <div class="input-group">

            <div class="input-group hidden" id="custom-config-group">

            <button class="btn" id="sub-generate">生成转换链接并复制</button>

    <div class="music-hint" id="music-hint">🎵 自动播放</div>
    <div class="music-player">
        <div class="music-toggle" id="music-toggle">💿</div>
    </div>

    <audio id="bg-music" loop preload="auto">
        <source src="https://mpimg.cn/view.php/bdc0ca74950742c28de37147a9bbeabe.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            const el = {
                btn: document.getElementById("sub-generate"),
                input: document.getElementById("sub-filepath"),
                target: document.getElementById("sub-options"),
                backend: document.getElementById("sub-backend"),
                config: document.getElementById("sub-config"),
                backendGroup: document.getElementById("custom-backend-group"),
                configGroup: document.getElementById("custom-config-group"),
                customBackend: document.getElementById("custom-backend"),
                customConfig: document.getElementById("custom-config"),
                resultBox: document.getElementById("result-container"),
                resultLink: document.getElementById("sub-link"),
                music: document.getElementById("bg-music"),
                musicBtn: document.getElementById("music-toggle"),
                musicHint: document.getElementById("music-hint")
            };

            function attemptAutoPlay() {
                el.music.play().then(() => {
                    el.musicBtn.classList.add("playing");
                    el.musicHint.textContent = '🎵 音乐播放中';
                }).catch(() => {
                    el.musicHint.textContent = '🎵 点击唱片播放';
                });
            }
            attemptAutoPlay();

            const enableMusicOnFirstInteraction = () => {
                if (el.music.paused) {
                    el.music.play().then(() => {
                        el.musicBtn.classList.add("playing");
                        el.musicHint.textContent = '🎵 音乐播放中';
                    }).catch(e => console.warn("play failed:", e));
                }
                document.removeEventListener('click', enableMusicOnFirstInteraction);
                document.removeEventListener('touchstart', enableMusicOnFirstInteraction);
            };
            if (el.music.paused) {
                document.addEventListener('click', enableMusicOnFirstInteraction, { once: true });
                document.addEventListener('touchstart', enableMusicOnFirstInteraction, { once: true });
            }

            el.musicBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                if (el.music.paused) {
                    el.music.play().then(() => {
                        el.musicBtn.classList.add("playing");
                        el.musicHint.textContent = '🎵 音乐播放中';
                    }).catch(() => alert("无法播放音频"));
                } else {
                    el.music.pause();
                    el.musicBtn.classList.remove("playing");
                    el.musicHint.textContent = '🎵 已暂停';
                }
            });

            document.querySelector('.avatar').addEventListener('click', () => {
                if (el.music.paused) {
                    el.music.play().then(() => {
                        el.musicBtn.classList.add("playing");
                        el.musicHint.textContent = '🎵 音乐播放中';
                    }).catch(() => {});
                } else {
                    el.music.pause();
                    el.musicBtn.classList.remove("playing");
                    el.musicHint.textContent = '🎵 已暂停';
                }
            });

            const configPresets = {
                clash: [
                    { name: "🏃 ACL4SSR Mini (推荐)", url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online_Mini.ini" },
                    { name: "🚫 ACL4SSR 广告屏蔽版", url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online_AdblockPlus.ini" },
                    { name: "🌏 ACL4SSR 日本优化", url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online_JP.ini" },
                    { name: "📱 ACL4SSR 无自动分组", url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online_NoAuto.ini" },
                    { name: "⚡ 懒人通用规则 (lhie1)", url: "https://cdn.jsdelivr.net/gh/lhie1/Rules@master/Clash/Providers/All.yaml" },
                ],
                singbox: [
                    { name: "🔰 Sing-box 通用路由", url: "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online_Mini.ini" },
                    { name: "📦 Sing-box 精简规则", url: "https://raw.githubusercontent.com/SagerNet/sing-box/refs/heads/main/release/config/client.json" },
                    { name: "✨ 凤鸣Singbox配置文件", url: "https://raw.githubusercontent.com/Fmstrat/sing-box-configs/main/config.json" },
                ],
                quanx: [
                    { name: "🍀 QuantumultX 懒人配置 (KOP)", url: "https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/QuantumultX_Profiles/KOP.conf" },
                    { name: "🧩 DivineEngine 规则集", url: "https://raw.githubusercontent.com/DivineEngine/Profiles/master/Quantumult/Outbound.conf" },
                ],
                loon: [
                    { name: "🛸 Loon 通用配置 (Choler)", url: "https://raw.githubusercontent.com/Choler/Loon/master/Config/Choler.conf" },
                    { name: "🎯 Loon 去广告配置", url: "https://raw.githubusercontent.com/Loon0x00/LoonExampleConfig/master/example.conf" },
                ],
                surge: [
                    { name: "⚡ Surge 萌新配置", url: "https://raw.githubusercontent.com/Blankwonder/Surge-Manual/master/profiles/demo.conf" },
                    { name: "🌿 Surge 去广告+规则", url: "https://raw.githubusercontent.com/ConnersHua/Profiles/master/Surge.conf" },
                ],
                surfboard: [
                    { name: "🏄 Surfboard 基础配置", url: "https://raw.githubusercontent.com/getsurfboard/surfboard/main/configs/surfboard.conf" },
                ],
                v2ray: [
                    { name: "📡 V2Ray (无需规则)", url: "" },
                ]
            };

            function getAllPresets(type) {
                let base = configPresets[type] || [];
                if (!base.some(item => item.url === "custom")) {
                    base.push({ name: "🔧 自定义规则链接", url: "custom" });
                }
                return base;
            }

            function updateConfigOptions() {
                const targetType = el.target.value;
                let simpleType = targetType;
                if (targetType.startsWith('surge')) simpleType = 'surge';
                else if (targetType.startsWith('singbox')) simpleType = 'singbox';

                const presetList = getAllPresets(simpleType);
                const seen = new Set();
                const uniquePresets = presetList.filter(opt => {
                    if (seen.has(opt.url)) return false;
                    seen.add(opt.url);
                    return true;
                });

                el.config.innerHTML = uniquePresets.map(opt => `<option value="${opt.url}">${opt.name}</option>`).join('');
                el.configGroup.classList.toggle("hidden", el.config.value !== "custom");
            }

            el.target.addEventListener("change", updateConfigOptions);

            el.backend.addEventListener("change", () => {
                el.backendGroup.classList.toggle("hidden", el.backend.value !== "custom");
            });

            el.config.addEventListener("change", () => {
                el.configGroup.classList.toggle("hidden", el.config.value !== "custom");
            });

            el.btn.addEventListener("click", () => {
                const rawLines = el.input.value.trim().split('\n').filter(l => l.trim() !== '');
                if (rawLines.length === 0) return alert("请粘贴订阅链接");

                const rawUrl = rawLines.join('|');
                let backend = el.backend.value === "custom" ? el.customBackend.value.trim() : el.backend.value;
                if (!backend) return alert("后端地址不能为空");
                if (!backend.includes('?')) backend += '?';

                let config = el.config.value === "custom" ? el.customConfig.value.trim() : el.config.value;
                let finalUrl = `${backend}target=${encodeURIComponent(el.target.value)}&url=${encodeURIComponent(rawUrl)}`;
                
                if (config) {
                    finalUrl += `&config=${encodeURIComponent(config)}`;
                }

                if (el.target.value.includes('clash') || el.target.value === 'clash') {
                    finalUrl += `&emoji=true&list=false&udp=true&scv=true&new_name=true`;
                }
                if (el.target.value.includes('singbox')) {
                    finalUrl += `&emoji=true&scv=true&new_name=true`; 
                }
                if (el.target.value === 'quanx') {
                    finalUrl += `&emoji=true&scv=true`;
                }

                el.resultLink.href = finalUrl;
                el.resultLink.textContent = finalUrl;
                el.resultBox.classList.remove("hidden");

                navigator.clipboard.writeText(finalUrl).then(() => {
                    alert("✅ 转换链接已复制！");
                }).catch(() => {
                    alert("⚠️ 链接已生成，请手动复制。");
                });
            });

            updateConfigOptions();
            el.backendGroup.classList.add("hidden");
            if (el.config.value === "custom") el.configGroup.classList.remove("hidden");
        })();
    </script>
